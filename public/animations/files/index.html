<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascota animada</title>
<style>
  /* ===== Mascota: copia este bloque a tu CSS ===== */
  .mascot {
    --w: 200px;               /* tamaño en pantalla (alto = automático) */
    --t: 1.1s;                /* duración del ciclo */
    position: relative;
    width: var(--w);
    aspect-ratio: 429 / 563;
    display: inline-block;
    isolation: isolate;
  }
  .mascot img {
    display: block; width: 100%; height: 100%;
    transform-origin: 50% 100%;
    animation: hop var(--t) infinite;
    will-change: transform;           /* solo transform: va por GPU */
    user-select: none; -webkit-user-drag: none;
  }
  .mascot::after {                    /* sombra en el suelo */
    content: ""; position: absolute; left: 20%; right: 20%; bottom: -4%;
    height: 6%; border-radius: 50%;
    background: rgba(0,0,0,.22); filter: blur(3px);
    animation: shadow var(--t) infinite;
    z-index: -1;
  }

  /* 0% y 100% son idénticos -> el bucle no da saltos */
  @keyframes hop {
    0%, 100% { transform: translateY(0)    scale(1.07, .93) rotate(-3deg);
               animation-timing-function: cubic-bezier(.2,.7,.3,1); }   /* impulso */
    45%      { transform: translateY(-9%)  scale(.96, 1.05) rotate(3deg);
               animation-timing-function: cubic-bezier(.6,0,.8,.4); }   /* cae */
  }
  @keyframes shadow {
    0%, 100% { transform: scale(1.05); opacity: .9; }
    45%      { transform: scale(.7);   opacity: .45; }
  }

  /* Variantes opcionales */
  .mascot.idle { --t: 2.4s; }
  .mascot.idle img { animation-name: idle; }
  .mascot.idle::after { animation-name: shadow-soft; }
  @keyframes shadow-soft { 0%,100% { transform: scale(1); opacity:.8 } 50% { transform: scale(.93); opacity:.65 } }
  @keyframes idle {
    0%, 100% { transform: translateY(0)   rotate(-2deg) scale(1, 1); }
    50%      { transform: translateY(-2%) rotate(2deg)  scale(.99, 1.015); }
  }
  .mascot:hover img { animation-duration: .6s; }   /* se emociona al pasar el cursor */

  /* Accesibilidad: sin movimiento si el usuario lo pide */
  @media (prefers-reduced-motion: reduce) {
    .mascot img, .mascot::after { animation: none; }
  }
  /* Pausa cuando la pestaña no se ve (ahorra batería) lo hace el navegador solo */

  /* ===== Solo para la demo ===== */
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px system-ui; background: transparent; gap: 2rem;
         grid-auto-flow: column; }
</style>
</head>
<body>
  <div class="mascot">
    <img src="tigger-1x.webp" srcset="tigger-1x.webp 1x, tigger.webp 2x"
         width="215" height="282" alt="Mascota saltando" decoding="async">
  </div>
  <div class="mascot idle" style="--w:140px">
    <img src="tigger-1x.webp" srcset="tigger-1x.webp 1x, tigger.webp 2x"
         width="215" height="282" alt="Mascota en reposo" decoding="async">
  </div>
</body>
</html>
