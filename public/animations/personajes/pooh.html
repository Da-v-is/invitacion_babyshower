<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pooh bebé — se menea feliz</title>
<style>

*, *::before, *::after { box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
/* ============ PERSONAJE: POOH BEBÉ = Comportamiento: está sentado, se
   balancea de lado a lado dando brincos chiquitos, como aplaudiendo
   de emoción. Anclado al suelo. Pasa el bloque marcado a la invitación. ==== */

/* --- INICIO BLOQUE POOH --- */
.pooh {
  --w: 135px;               /* tamaño en pantalla */
  --t: 1.9s;                /* duración del ciclo */
  position: relative; width: var(--w);
}
.pooh img {
  display: block; width: 100%; height: auto;
  transform-origin: 50% 96%;
  animation: pooh-wiggle var(--t) ease-in-out infinite;
  will-change: transform; user-select: none; -webkit-user-drag: none;
}
.pooh::after {             /* sombra en el suelo */
  content: ""; position: absolute; left: 22%; right: 22%; bottom: -8px;
  height: 9px; border-radius: 50%;
  background: rgba(90,62,27,.25); filter: blur(3px);
  animation: pooh-shadow var(--t) ease-in-out infinite;
}
@keyframes pooh-wiggle {
  0%, 100% { transform: rotate(-5deg) translateY(0)    scale(1.02,.98); }
  15%      { transform: rotate(0deg)   translateY(-5%) scale(.98,1.03); }
  30%      { transform: rotate(5deg)   translateY(0)    scale(1.02,.98); }
  45%      { transform: rotate(0deg)   translateY(-5%) scale(.98,1.03); }
  60%      { transform: rotate(-3deg)  translateY(0)    scale(1.01,.99); }
  80%      { transform: rotate(3deg)   translateY(-2%)  scale(1,.99); }
}
@keyframes pooh-shadow {
  0%, 30%, 60%, 100% { transform: scaleX(1);   opacity: .85; }
  15%, 45%           { transform: scaleX(.85); opacity: .55; }
}
.pooh:hover img { animation-duration: 1s; }    /* más contento al cursor */
/*--- FIN BLOQUE POOH ---*/

/* Solo para la demo */
@media (prefers-reduced-motion: reduce) { .pooh img, .pooh::after { animation: none; } }
body { margin:0; min-height:100vh; display:grid; place-items:end center;
       background: transparent; padding-bottom: 8vh; }
</style>
</head>
<body>
  <div class="pooh">
    <img src="../pooh.png" alt="Pooh bebé sentado" decoding="async">
  </div>
</body>
</html>
