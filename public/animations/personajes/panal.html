<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panal — columpio de rama</title>
<style>

*, *::before, *::after { box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
/* ============ PERSONAJE: PANAL = Comportamiento: cuelga de la rama y
   oscila como un péndulo, con una leve "respiración" del dibujo.
   (La versión con abejas orbitando está en ../Abejas rondando el panal.html)
   Pasa el bloque marcado a la invitación. ================================= */

/* --- INICIO BLOQUE PANAL --- */
.hive-swing {
  width: var(--w);
  transform-origin: 50% 15%;           /* el punto donde va la rama */
  animation: hive-swing 3.6s ease-in-out infinite alternate;
}
@keyframes hive-swing {
  from { transform: rotate(-3.5deg); }
  to   { transform: rotate(3.5deg); }
}
.hive { --w: 150px; }                    /* tamaño en pantalla */
.hive img {
  display: block; width: 100%; height: auto;
  animation: hive-breathe 3.6s ease-in-out infinite alternate;
  will-change: transform; user-select: none; -webkit-user-drag: none;
}
@keyframes hive-breathe {                /* leve respiración extra */
  from { scale: 1; }
  to   { scale: 1.02; }
}
/*--- FIN BLOQUE PANAL ---*/

/* Solo para la demo */
@media (prefers-reduced-motion: reduce) {
  .hive-swing, .hive img { animation: none; }
}
body { margin:0; min-height:100vh; display:grid; place-items:center end;
       background: transparent; padding-bottom: 10vh; }
</style>
</head>
<body>
  <div class="hive-swing">
    <div class="hive">
      <img src="../panal.png" alt="Panal colgado de una rama" decoding="async">
    </div>
  </div>
</body>
</html>
