<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olla de miel — gelatina con abejas aleteando</title>
<style>

*, *::before, *::after { box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
/* ============ PERSONAJE: HONEY POT = Comportamiento: la olla tiembla como
   gelatina (está bien llena) y las 3 abejitas que van encima ALETEAN de
   verdad: sus 6 alas se cortaron del dibujo y cada una gira en su propio
   punto de inserción, igual que las del panal. Los cuerpos quedan quietos.
   Imágenes: miel-cuerpo.png + miel-ala-1..6.png (mismo lienzo 500x500).
   Los porcentajes de transform-origin salen de px medidos por el script:
   ala-1(186,210) ala-2(240,130) ala-3(238,204) ala-4(271,85) ala-5(315,206) ala-6(344,171)
   ========================================================================== */

/* --- INICIO BLOQUE HONEY POT --- */
.miel {
  --w: 175px;                /* tamaño en pantalla */
  width: var(--w); aspect-ratio: 1; position: relative;
  transform-origin: 50% 92%;
  animation: miel-gelatina 2.6s ease-in-out infinite;
}
@keyframes miel-gelatina {
  0%, 100% { transform: scale(1,1)         rotate(0deg); }
  25%      { transform: scale(1.045,.955)  rotate(-1.5deg); }
  50%      { transform: scale(.97,1.03)    rotate(1.2deg); }
  75%      { transform: scale(1.028,.972)  rotate(-.8deg); }
}
.miel img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  user-select: none; -webkit-user-drag: none; will-change: transform;
}
.miel .cuerpo { z-index: 1; }
.miel .ala { z-index: 2; animation: miel-aleteo .16s ease-in-out infinite alternate; }
@keyframes miel-aleteo { from { transform: rotate(-13deg); } to { transform: rotate(13deg); } }
/* cada ala con su pivote propio; delays negativos rompen la sincronía */
.miel .ala-1 { transform-origin: 37.2% 42%;   animation-delay: -.02s; }
.miel .ala-2 { transform-origin: 48% 26%;     animation-delay: -.06s; }
.miel .ala-3 { transform-origin: 47.6% 40.8%; animation-delay: -.04s; }
.miel .ala-4 { transform-origin: 54.2% 17%;   animation-delay: -.08s; }
.miel .ala-5 { transform-origin: 63% 41.2%;   animation-delay: -.03s; }
.miel .ala-6 { transform-origin: 68.8% 34.2%; animation-delay: -.05s; }
/*--- FIN BLOQUE HONEY POT ---*/

/* Solo para la demo */
@media (prefers-reduced-motion: reduce) { .miel, .miel .ala { animation: none; } }
body { margin:0; min-height:100vh; display:grid; place-items:end center;
       background: transparent; padding-bottom: 8vh; }
</style>
</head>
<body>
  <div class="miel">
    <img class="cuerpo" src="miel-cuerpo.png" alt="Olla de miel con abejas" decoding="async">
    <img class="ala ala-1" src="miel-ala-1.png" alt="">
    <img class="ala ala-2" src="miel-ala-2.png" alt="">
    <img class="ala ala-3" src="miel-ala-3.png" alt="">
    <img class="ala ala-4" src="miel-ala-4.png" alt="">
    <img class="ala ala-5" src="miel-ala-5.png" alt="">
    <img class="ala ala-6" src="miel-ala-6.png" alt="">
  </div>
</body>
</html>
