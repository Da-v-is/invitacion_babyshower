<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mariposa — revoloteo elegante con alas</title>
<style>

*, *::before, *::after { box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
/* ============ PERSONAJE: MARIPOSA = Comportamiento: flota en curvas
   suaves por la pantalla y sus alas LATEN de verdad: el dibujo se partió
   en 2 mitades (izquierda/derecha del cuerpo) que se pliegan hacia el
   cuerpo con un plegado (scaleX) alrededor del eje del cuerpo.
   Imágenes: mariposa-cuerpo.png + mariposa-ala-izq.png + mariposa-ala-der.png
   (mismo lienzo de 514x485, se superponen).  ============================= */

/* --- INICIO BLOQUE MARIPOSA --- */
.bf-camino {                 /* camino ondulado en bucle (recorrido) */
  width: var(--w);
  animation: bf-float 8s ease-in-out infinite;
}
@keyframes bf-float {
  0%, 100% { transform: translate(0, 12%); }
  25%      { transform: translate(24%, -8%); }
  50%      { transform: translate(48%, 14%); }
  75%      { transform: translate(24%, -2%); }
}
.mariposa {
  --w: min(115px, 100%);     /* escala con el marco, conserva la proporción */
  width: var(--w); aspect-ratio: 514 / 485; position: relative;
  animation: bf-sway 5s ease-in-out infinite alternate;  /* balanceo poético */
}
@keyframes bf-sway {
  from { transform: rotate(-4deg) translateY(-3%); }
  to   { transform: rotate(4deg)  translateY(3%); }
}
.mariposa img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  user-select: none; -webkit-user-drag: none; will-change: transform;
}
.mariposa .cuerpo { z-index: 1; }        /* el cuerpo no se pliega */
/* cada ala se pliega hacia el eje del cuerpo (px medidos: 172..209, y 294) */
.mariposa .ala-izq { z-index: 2; transform-origin: 33.5% 60.6%;
  animation: bf-pliegue .7s ease-in-out infinite alternate; }
.mariposa .ala-der { z-index: 2; transform-origin: 40.7% 60.6%;
  animation: bf-pliegue .7s ease-in-out infinite alternate; }
@keyframes bf-pliegue {
  from { transform: scaleX(1); }
  to   { transform: scaleX(.24); }       /* ala plegada */
}
/*--- FIN BLOQUE MARIPOSA ---*/

/* Solo para la demo */
@media (prefers-reduced-motion: reduce) {
  .bf-camino, .mariposa, .mariposa .ala-izq, .mariposa .ala-der { animation: none; }
}
body { margin:0; min-height:100vh; display:grid; place-items:center start;
       background: transparent; padding: 0; }
</style>
</head>
<body>
  <div class="bf-camino">
    <div class="mariposa">
      <img class="ala-izq" src="mariposa-ala-izq.png" alt="" decoding="async">
      <img class="ala-der" src="mariposa-ala-der.png" alt="" decoding="async">
      <img class="cuerpo" src="mariposa-cuerpo.png" alt="Mariposa" decoding="async">
    </div>
  </div>
</body>
</html>
